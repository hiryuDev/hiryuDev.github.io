<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品詳細</title>
  <meta name="theme-color" content="#140b0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&family=Shippori+Mincho+B1:wght@500;700;800&family=Shippori+Mincho:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // データを読み込んで文章を差し替えるまで、初期の文章を隠しておく（3秒たっても終わらなければ表示）
    document.documentElement.classList.add('js', 'is-loading');
    setTimeout(function () { document.documentElement.classList.remove('is-loading'); }, 3000);
  </script>
</head>
<body class="page-work">
  <a class="skip-link" href="#log">本文へ移動</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html">
        <svg class="brand__mark" aria-hidden="true"><use href="images/icons.svg#i-skull"/></svg>
        <span class="brand__text"><span data-bind="texts.brand">ゲーム開発ポートフォリオ</span><small data-bind="profile.name">ひりゅう</small></span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="siteNav">
        <svg aria-hidden="true"><use href="images/icons.svg#i-compass"/></svg>
        <span>目次</span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="サイトの目次">
        <ul>
          <li><a href="index.html#profile">プロフィール</a></li>
          <li><a href="index.html#works" aria-current="true">作品</a></li>
          <li data-section="internship" hidden><a href="index.html#internship">インターン</a></li>
          <li><a href="index.html#skills">スキル</a></li>
          <li><a href="index.html#contact">連絡先</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="log" class="log" tabindex="-1">
    <article class="sheet" id="work">
      <div class="sheet__runner"><span data-bind="texts.brand">ゲーム開発ポートフォリオ</span><span id="runnerNo">作品詳細</span></div>
      <a class="back-link" href="index.html#works"><svg aria-hidden="true"><use href="images/icons.svg#i-left"/></svg>作品一覧へ戻る</a>
      <div id="workBody" aria-live="polite"><p>読み込んでいます…</p></div>
    </article>
  </main>

  <footer class="site-footer">
    <p class="site-footer__end" data-bind="texts.footer">ご覧いただきありがとうございました。</p>
    <p class="site-footer__copy">&copy; <span id="year"></span> <span data-bind="profile.name">ひりゅう</span></p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="スクリーンショットの拡大表示">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="閉じる"><svg><use href="images/icons.svg#i-close"/></svg></button>
    <img id="lightboxImg" alt="">
    <p id="lightboxCaption"></p>
  </dialog>

  <script src="js/common.js"></script>
  <script src="js/work.js"></script>
</body>
</html>
