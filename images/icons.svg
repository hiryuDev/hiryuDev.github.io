<svg xmlns="http://www.w3.org/2000/svg">
  <!-- すべてこのサイトのために描いたオリジナルの装飾。<use href="images/icons.svg#i-xxx"> で呼び出す -->

  <!-- ドクロと交差したカトラス -->
  <symbol id="i-skull" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
      <path d="M7 59 Q33 50 59 33"/>
      <path d="M57 59 Q31 50 5 33"/>
      <path d="M10 52.5l3.4 9M54 52.5l-3.4 9"/>
    </g>
    <g fill="currentColor"><circle cx="6" cy="60" r="3"/><circle cx="58" cy="60" r="3"/></g>
    <path transform="translate(0 -6)" fill="currentColor" fill-rule="evenodd" d="M32 11c-10.5 0-18 7.3-18 16.6 0 6 2.9 10.4 7.2 12.6v6.3c0 1.5 1.2 2.5 2.6 2.5h16.4c1.4 0 2.6-1 2.6-2.5v-6.3c4.3-2.2 7.2-6.6 7.2-12.6C50 18.3 42.5 11 32 11zM25.6 22.4a4.6 4.6 0 1 1 0 9.2a4.6 4.6 0 0 1 0-9.2zM38.4 22.4a4.6 4.6 0 1 1 0 9.2a4.6 4.6 0 0 1 0-9.2zM32 32.5l-2.6 5h5.2zM26.2 41.5h2.6v5h-2.6zM30.7 41.5h2.6v5h-2.6zM35.2 41.5h2.6v5h-2.6z"/>
  </symbol>

  <!-- 錨 -->
  <symbol id="i-anchor" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="10" r="5"/>
      <path d="M32 15v40"/>
      <path d="M21 23h22"/>
      <path d="M10 37c2 11 11 18 22 18s20-7 22-18"/>
      <path d="M6 41l4-5 5 4M58 41l-4-5-5 4"/>
    </g>
  </symbol>

  <!-- 羅針盤（コンパスローズ） -->
  <symbol id="i-compass" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 3"/>
    <path fill="currentColor" d="M32 2l5 25-5 5-5-5zM32 62l-5-25 5-5 5 5zM2 32l25-5 5 5-5 5zM62 32l-25 5-5-5 5-5z"/>
    <path fill="currentColor" opacity=".55" d="M48 16l-12 13-4 3 3-4zM16 48l12-13 4-3-3 4zM16 16l13 12 3 4-4-3zM48 48l-13-12-3-4 4 3z"/>
    <circle cx="32" cy="32" r="2.6" fill="currentColor"/>
  </symbol>

  <!-- 船の舵 -->
  <symbol id="i-helm" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <circle cx="32" cy="32" r="17"/>
      <circle cx="32" cy="32" r="5"/>
      <path d="M32 4v23M32 37v23M4 32h23M37 32h23M12.2 12.2l16.3 16.3M35.5 35.5l16.3 16.3M51.8 12.2L35.5 28.5M28.5 35.5L12.2 51.8"/>
    </g>
  </symbol>

  <!-- 宝箱 -->
  <symbol id="i-chest" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round">
      <path d="M8 30c0-10 10-16 24-16s24 6 24 16"/>
      <rect x="8" y="30" width="48" height="24" rx="2"/>
      <path d="M8 38h48M20 16v38M44 16v38"/>
      <rect x="28" y="33" width="8" height="10" rx="1.5"/>
    </g>
    <circle cx="32" cy="37.5" r="1.6" fill="currentColor"/>
  </symbol>

  <!-- 金貨 -->
  <symbol id="i-coin" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.5" fill="currentColor"/>
    <circle cx="12" cy="12" r="7.6" fill="none" stroke="rgba(60,35,5,.45)" stroke-width="1.2"/>
    <path d="M12 7.5l1.3 3h3.2l-2.6 1.9 1 3.1L12 13.6l-2.9 1.9 1-3.1-2.6-1.9h3.2z" fill="rgba(60,35,5,.45)"/>
  </symbol>
  <symbol id="i-coin-empty" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2.2"/>
  </symbol>

  <!-- 封蝋の縁（不規則な円） -->
  <symbol id="i-seal" viewBox="0 0 100 100">
    <path fill="currentColor" d="M50 3c6 0 8 4 13 5s10-2 14 2 2 9 5 13 8 5 9 11-3 8-3 13 4 9 2 14-8 6-10 11-1 10-6 13-9-1-14 1-8 6-14 6-8-4-13-5-10 2-14-2-2-9-5-13-8-5-9-11 3-8 3-13-4-9-2-14 8-6 10-11 1-10 6-13 9 1 14-1 8-6 13-6z"/>
  </symbol>

  <!-- 角飾り -->
  <symbol id="i-corner" viewBox="0 0 80 80">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 76V20C4 11 11 4 20 4h56"/>
      <path d="M12 76V26c0-8 6-14 14-14h50"/>
      <path d="M20 40c0-11 9-20 20-20"/>
      <path d="M26 30c4 6 10 6 14 0"/>
    </g>
    <circle cx="20" cy="20" r="4" fill="currentColor"/>
  </symbol>

  <!-- 羽ペン -->
  <symbol id="i-quill" viewBox="0 0 64 64">
    <path fill="currentColor" d="M56 4C38 8 24 20 18 36l-4 12 3 1 4-9c6 0 14-4 19-10-4 1-8 1-11 0 6-2 12-6 16-12-3 1-6 1-8 0 8-4 14-9 19-14z"/>
    <path d="M14 48L8 60" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>

  <!-- きらめき（AIの使用） -->
  <symbol id="i-spark" viewBox="0 0 24 24">
    <path fill="currentColor" d="M10 2l1.8 5.6L17.5 9.5l-5.7 1.9L10 17l-1.8-5.6L2.5 9.5l5.7-1.9zM18.5 13l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/>
  </symbol>

  <!-- 地図のバツ印 -->
  <symbol id="i-mark" viewBox="0 0 24 24">
    <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
  </symbol>

  <!-- 小さなUIアイコン -->
  <symbol id="i-mail" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6l8.5 7 8.5-7"/></g>
  </symbol>
  <symbol id="i-link" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></g>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <!-- スクロール位置を示す小舟 -->
  <symbol id="i-ship" viewBox="0 0 48 40">
    <path fill="currentColor" d="M4 27h40l-6 9H10z"/>
    <path fill="currentColor" d="M23 3v22h2V3z"/>
    <path fill="currentColor" opacity=".85" d="M25 5c7 3 11 9 11 17H25zM23 8c-5 3-9 8-9 14h9z"/>
    <path fill="currentColor" d="M25 3l7 2-7 2z"/>
  </symbol>
</svg>
